# PhotoMemory CI — Quality Gates
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check backend/

      - name: Type check with mypy
        run: mypy --ignore-missing-imports --explicit-package-bases --exclude "backend/(api_server|chat_tools|db/async_connection)\.py" --exclude "scripts/" backend/ || true

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=backend --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t photomemory .
