# PhotoMemory CI (Main Build & Smoke Test)
# 仅做最基本的构建和 API 启动验证

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t photomemory-test .

      - name: Run container and check API health
        run: |
          docker run -d --name pmtest -p 8765:8765 photomemory-test
          sleep 10
          curl -f http://localhost:8765/api/health
          docker stop pmtest
          docker rm pmtest

      - name: Python import test (backend.api_server)
        run: |
          python3 -c 'import backend.api_server'
